# Included in the existing Nginx http context on the Tencent origin.
map $uri $focuence_cache_control {
    default "no-cache";
    ~^/Focuence/assets/(main|styles)\.[0-9a-f]+\.(js|css)$ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name focuence-origin.internal;
    root /srv/focuence/current;
    charset utf-8;

    add_header Cache-Control $focuence_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;

    location = /Focuence {
        alias /srv/focuence/current/index.html;
        default_type text/html;
    }
    location = /Focuence/ {
        try_files /index.html =404;
        default_type text/html;
    }
    location = /Focuence/release.json {
        alias /srv/focuence/current/release.json;
        default_type application/json;
    }
    location ^~ /Focuence/assets/ {
        alias /srv/focuence/current/assets/;
        autoindex off;
    }
    location / {
        return 404;
    }

    access_log off;
    error_log /www/wwwlogs/focuence-origin.error.log warn;
}
