<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focuence智序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #374151;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            width: 360px;
            min-height: 500px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: #1f2937;
            color: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .settings-btn {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .settings-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 16px 24px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            display: block;
        }

        .stat-label {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
        }

        /* 功能按钮 */
        .actions {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .action-btn.primary {
            background: #617247;
            color: white;
        }

        .action-btn.primary:hover {
            background: #4a5a36;
            transform: translateY(-1px);
        }

        .action-btn.secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .action-btn.secondary:hover {
            background: #e5e7eb;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 内容区域 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 20px;
        }

        /* 分组结果 */
        .groups {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .group {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .group-name {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }

        .group-count {
            font-size: 11px;
            color: #6b7280;
            background: #e5e7eb;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .group-tabs {
            padding: 8px;
        }

        .tab-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            margin-bottom: 2px;
            border-radius: 4px;
            font-size: 11px;
            color: #6b7280;
        }

        .tab-item:hover {
            background: #f9fafb;
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }

        .tab-close {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 10px;
            line-height: 1;
        }

        .tab-close:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        /* 清理建议 */
        .suggestions {
            margin-bottom: 20px;
        }

        .suggestion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            border-left: 3px solid #617247;
        }

        .suggestion-content {
            flex: 1;
            min-width: 0;
        }

        .suggestion-title {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .suggestion-reason {
            font-size: 10px;
            color: #6b7280;
        }

        .suggestion-close {
            background: #617247;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .suggestion-close:hover {
            background: #4a5a36;
        }

        /* 底部版权 */
        .footer {
            padding: 12px 24px;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .footer p {
            font-size: 10px;
            color: #9ca3af;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f9fafb;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .empty-state-text {
            font-size: 12px;
            margin-bottom: 16px;
        }

        /* 加载状态 */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #617247;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 分组操作按钮样式 */
        .group-actions {
            padding: 8px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        
        .create-group-btn {
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .create-group-btn:hover {
            background: #a7f3d0;
        }
        
        .highlight-group-btn {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .highlight-group-btn:hover {
            background: #e5e7eb;
        }
        
        .close-group-btn {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .close-group-btn:hover {
            background: #fecaca;
        }
        
        /* 状态信息样式 */
        #statusInfo {
            display: none;
            padding: 8px 24px;
            font-size: 11px;
            color: #6b7280;
            text-align: center;
        }
        
        /* 返回按钮样式 */
        .back-btn {
            background: none;
            border: 1px solid #d1d5db;
            color: #6b7280;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .back-btn:hover {
            background: #f3f4f6;
        }
        
        /* 分组头部样式 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        /* 分组状态样式 */
        .group-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .status-active {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-stale {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .status-normal {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        /* 分组原因样式 */
        .group-reason {
            font-size: 11px;
            color: #6b7280;
            padding: 6px 12px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>Focuence智序</h1>
            <button class="settings-btn" title="设置">
                <svg class="settings-icon" viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
            </button>
        </div>
        
        <!-- 统计信息 -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-value" id="tabCount">0</span>
                <div class="stat-label">标签页</div>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="attentionScore">0.0</span>
                <div class="stat-label">注意力</div>
            </div>
        </div>
        
        <!-- 功能按钮 -->
        <div class="actions">
            <button class="action-btn primary" id="aiGroupingBtn">
                智能分组
                <span class="loading" id="aiLoading"></span>
            </button>
            <button class="action-btn secondary" id="cleaningBtn">
                清理建议
                <span class="loading" id="cleanLoading"></span>
            </button>
        </div>
        
        <!-- 状态信息 -->
        <div id="statusInfo"></div>
        
        <!-- 内容区域 -->
        <div class="content">
            <!-- 分组结果 -->
            <div class="groups" id="groupsSection" style="display: none;">
                <div class="section-header">
                    <div class="section-title">分组结果</div>
                    <div>
                        <button class="back-btn" id="groupsBackBtn">返回</button>
                        <button class="back-btn" id="regroupBtn" style="margin-left: 8px;">再次分组</button>
                    </div>
                </div>
                <div id="groupsContainer"></div>
                <div style="padding: 12px 0 8px 0; text-align: center;">
                    <button class="action-btn primary" id="createAllGroupsBtn" style="width: 100%;">全部分组</button>
                </div>
            </div>
            
            <!-- 清理建议 -->
            <div class="suggestions" id="suggestionsSection" style="display: none;">
                <div class="section-header">
                    <div class="section-title">清理建议</div>
                    <button class="back-btn" id="suggestionsBackBtn">返回</button>
                </div>
                <div id="suggestionsContainer"></div>
            </div>
            
            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="empty-state-text"></div>
            </div>
        </div>
        
        <!-- 底部版权 -->
        <div class="footer">
            <p>© 2025@LessLand</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
