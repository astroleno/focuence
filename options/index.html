<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focuence智序 - 设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #374151;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            background: #ffffff;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: #1f2937;
            color: white;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input[type="url"],
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input[type="url"]:focus,
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #617247;
            box-shadow: 0 0 0 3px rgba(97, 114, 71, 0.1);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #617247;
        }

        .test-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .test-btn:hover {
            background: #4b5563;
        }

        .test-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            margin-top: 32px;
        }

        .save-btn {
            background: #617247;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .save-btn:hover {
            transform: translateY(-1px);
        }

        .reset-btn {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background: #e5e7eb;
        }

        .status-message {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
        }

        .status-message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .description {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>设置</h1>
            <button class="close-btn" title="关闭">✕</button>
        </div>
        
        <div class="content">
            <!-- AI设置 -->
            <div class="section">
                <h2 class="section-title">AI 设置</h2>
                
                <div class="form-group">
                    <label for="apiEndpoint">API 地址</label>
                    <input type="url" id="apiEndpoint" placeholder="https://yunwu.zeabur.app">
                    <div class="description">OpenAI兼容的API地址</div>
                </div>
                
                <div class="form-group">
                    <label for="model">模型名称</label>
                    <input type="text" id="model" placeholder="gpt-4o-mini">
                    <div class="description">使用的AI模型名称</div>
                </div>
                
                <div class="form-group">
                    <label for="apiKey">API 密钥</label>
                    <input type="password" id="apiKey" placeholder="输入您的API密钥">
                    <div class="description">您的API访问密钥</div>
                </div>
                
                <div class="form-group">
                    <button class="test-btn" id="testBtn">测试连接</button>
                    <div id="statusMessage"></div>
                </div>
            </div>
            
            <!-- 通用设置 -->
            <div class="section">
                <h2 class="section-title">通用设置</h2>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoGrouping">
                        自动分组标签页
                    </label>
                    <div class="description">开启后自动对标签页进行分组</div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="cleaningSuggestions">
                        显示清理建议
                    </label>
                    <div class="description">在popup中显示清理建议</div>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="actions">
                <button class="reset-btn" id="resetBtn">重置默认</button>
                <button class="save-btn" id="saveBtn">保存设置</button>
            </div>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
