<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focuence智序 - 设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #374151;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            background: #ffffff;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: #1f2937;
            color: white;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .content {
            flex: 1;
            padding: 32px;
        }

        .section {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
            font-size: 14px;
        }

        .form-description {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="url"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #ffffff;
            color: #1f2937;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-group input {
            flex: 1;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-test {
            padding: 6px 12px;
            font-size: 12px;
            background: #10b981;
            color: white;
        }

        .btn-test:hover {
            background: #059669;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-weight: 500;
            text-align: center;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .status-info {
            background: #e0f2fe;
            color: #0c4a6e;
            border: 1px solid #b3e5fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Focuence智序 - 设置</h1>
            <button class="close-btn" title="关闭设置">×</button>
        </header>

        <main class="content">
            <div id="statusMessage" style="display: none;"></div>

            <section class="section">
                <h2>AI 配置</h2>
                <div class="form-group">
                    <label for="apiEndpoint">API 端点</label>
                    <div class="form-description">API 服务地址，支持OpenAI兼容接口</div>
                    <div class="input-group">
                        <input type="url" id="apiEndpoint" placeholder="https://api.openai.com" />
                        <button class="btn btn-test" id="testBtn">测试连接</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="model">AI 模型</label>
                    <div class="form-description">输入用于智能分组的语言模型名称</div>
                    <input type="text" id="model" placeholder="gpt-4o-mini" />
                </div>
                
                <div class="form-group">
                    <label for="apiKey">API 密钥</label>
                    <div class="form-description">您的OpenAI API密钥，本地存储，不会上传</div>
                    <input type="password" id="apiKey" placeholder="sk-..." />
                </div>
            </section>

            <section class="section">
                <h2>界面设置</h2>
                <div class="form-group">
                    <label>主题</label>
                    <div class="form-description">应用主题已设置为自动跟随系统</div>
                    <div style="padding: 8px 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; color: #6b7280;">
                        🌓 自动跟随系统主题
                    </div>
                </div>
            </section>

            <section class="section">
                <h2>工作模式</h2>
                <div class="form-group">
                    <label for="workMode">默认工作模式</label>
                    <div class="form-description">选择默认的标签页管理模式</div>
                    <select id="workMode">
                        <option value="balanced">智能平衡</option>
                        <option value="focus">专注模式</option>
                        <option value="research">研究模式</option>
                        <option value="development">开发模式</option>
                        <option value="casual">休闲模式</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="autoModeSwitch"> 
                        自动模式切换
                    </label>
                    <div class="form-description">根据标签页内容和行为自动切换工作模式</div>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="timeBasedMode"> 
                        基于时间的模式切换
                    </label>
                    <div class="form-description">根据时间段自动切换模式（如工作时间自动开启专注模式）</div>
                </div>
            </section>

            <div class="actions">
                <button class="btn btn-primary" id="saveBtn">保存设置</button>
                <button class="btn btn-secondary" id="resetBtn">重置为默认</button>
                <button class="btn btn-secondary" id="shortcutsBtn">自定义快捷键</button>
            </div>
        </main>
    </div>

    <script src="options.js"></script>
</body>
</html>
